<!doctype html>
<html><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>The Orbit</title>
  <link rel="stylesheet" href="/static/styles.css"/>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="wrap">
    <div class="layout-shell">
      <header class="system-strip" id="system-strip" data-region="system strip">
        <div class="app-title">
          <img class="app-title__icon" src="/static/gravity-node.svg" alt="" aria-hidden="true"/>
          <h1>The Orbit</h1>
        </div>
        <p class="sub">For live priorities, not task lists</p>
        <div class="system-strip__row">
          <div class="context-head" data-region="context">
            <span id="context-name" class="context-name">{{.CurrentContextTitle}}</span>
            <button id="open-contexts" class="context-link" title="Open Context Canvas">◎</button>
          </div>
          <div class="toolbar" id="toolbar"></div>
          <div class="system-ack-stack" id="system-ack-stack" aria-live="polite" aria-atomic="true"></div>
        </div>
      </header>
      <div class="canvas-region" data-region="canvas">
        <div class="surface" id="surface">
          <div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="orbit o4"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.__ITEMS__ = {{.ItemsJSON}};
    window.__HIDDEN_COUNT__ = {{.HiddenCount}};
    window.__MODE__ = "{{.Mode}}";
    window.__CURRENT_CONTEXT_ID__ = "{{.CurrentContextID}}";
    window.__CURRENT_CONTEXT_TITLE__ = "{{.CurrentContextTitle}}";
    window.__MOBILE_MODE__ = {{if .MobileMode}}true{{else}}false{{end}};
  </script>
  {{if .MobileMode}}
  <script src="/static/app-mobile.js"></script>
  {{else}}
  <script src="/static/app.js"></script>
  {{end}}
</body></html>
