<!doctype html>
<html><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>The Orbit</title>
  <link rel="stylesheet" href="/static/styles.css"/>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="wrap">
    <h1 style="font-size: {{.HeadingSize}}">{{.PageTitle}}</h1>
    <p class="sub">Drop-to-place strategic surface — position is truth.</p>
    <div class="surface" id="surface">
      <div class="context-head in-canvas">
        <span id="context-name" class="context-name">{{.CurrentContextTitle}}</span>
        <button id="open-contexts" class="context-link" title="Open Context Canvas">◎</button>
      </div>
      <div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="orbit o4"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="hint">Drop anywhere and it stays there. Colors change card fill.</div>
    </div>
  </div>
  <script>
    window.__ITEMS__ = {{.ItemsJSON}};
    window.__HIDDEN_COUNT__ = {{.HiddenCount}};
    window.__MODE__ = "{{.Mode}}";
    window.__CURRENT_CONTEXT_ID__ = "{{.CurrentContextID}}";
    window.__CURRENT_CONTEXT_TITLE__ = "{{.CurrentContextTitle}}";
  </script>
  <script src="/static/app.js"></script>
</body></html>
